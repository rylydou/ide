name: ide

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ide}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ide}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-ide} -d ${POSTGRES_DB:-ide}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    # Not published to the host by default. Uncomment to inspect with psql/drizzle-kit studio.
    # Not published to the host by default. Uncomment to inspect with psql/drizzle-kit studio.
    ports:
      - "127.0.0.1:5432:5432"

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ide}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ide}
      ADMIN_SECRET: ${ADMIN_SECRET:?set ADMIN_SECRET in .env}
      ORIGIN: ${ORIGIN:?set ORIGIN in .env, e.g. https://ide.example.org}
      BODY_SIZE_LIMIT: ${BODY_SIZE_LIMIT:-1M}
      PORT: 3000
    # Not published to the host by default. Uncomment to inspect with psql/drizzle-kit studio.
    ports:
      - '${APP_PORT:-3000}:3000'

volumes:
  pgdata:
